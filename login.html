    <!-- Log in Form Section👇 -->
    <section id="Log-In" class="contain w-lg-25 w-md-25 px-lg-5 py-5">
      <h1>Login to Start Watching</h1>
      <form action="" id="Form">
        <!--  -->

        <div class="login-inputs" id="email-login-input">
          <label for="email">Email:</label>
          <input id="email" type="email" autocomplete="on"/>
          <p class="error" id="email-err"></p>
        </div>

        <!-- <div class="login-inputs">
            <label for="username">Username:</label>
            <input id="username" type="text" />
          </div> -->

        <div class="login-inputs" id="password-login-input">
          <label for="password">Password:</label>
          <input id="password" type="password" />
          <p class="error" id="password-err"></p>
            <button onclick="revealPassword()" id="reveal-password" class=" p-1 btn btn-success btnNoDefault revealPasswords"><i class="bi bi-eye"></i></button>
        </div>

        <button id="Submit" class="btn btn-primary my-1 my-md-4" type="submit">
          Login
        </button>
      </form>
    </section>
